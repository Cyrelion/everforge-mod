plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}

group = 'de.everforge'
version = providers.gradleProperty('mod_version').get()

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.250'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    archiveBaseName = 'everforge-mod'
}

tasks.named('processResources', ProcessResources).configure {
    def modVersion = providers.gradleProperty('mod_version')
    inputs.property('mod_version', modVersion)

    filesMatching('META-INF/neoforge.mods.toml') {
        expand(mod_version: modVersion.get())
    }
}


repositories {
    maven {
        name = 'EngineHub'
        url = 'https://maven.enginehub.org/repo/'
    }
    maven {
        name = 'Create'
        url = 'https://maven.createmod.net'
    }
    maven {
        name = 'Registrate'
        url = 'https://maven.ithundxr.dev/snapshots'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    /*
     * APIs are supplied at runtime by the actual server mods.
     *
     * IMPORTANT:
     * Keep WorldEdit/OpenPAC compile-only dependencies non-transitive.
     *
     * WorldEdit 7.3.8 publishes a strict Guava 32.1.3-jre constraint while
     * Minecraft 1.21.1 / NeoForge's compile environment pins Guava 32.1.2-jre
     * (and parts of FML use 31.x). Pulling WorldEdit transitively therefore
     * makes Gradle's compileClasspath unsatisfiable even though Everforge only
     * needs WorldEdit's own API classes at compile time.
     *
     * The real WorldEdit/OpenPAC/Create mods provide their complete dependency
     * graphs at runtime on Everforge.
     */
    compileOnly('com.sk89q.worldedit:worldedit-core:7.3.8') {
        transitive = false
    }

    compileOnly('maven.modrinth:gF3BGWvG:AzM8UF04') {
        transitive = false
    }

    // Create 6.0.10 development dependency, matching the Everforge runtime.
    // The supporting libraries are compile-time only and are already provided
    // by Create in the actual modpack/server environment.
    compileOnly('com.simibubi.create:create-1.21.1:6.0.10-280:slim') {
        transitive = false
    }
    compileOnly('net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1')
    compileOnly('dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6')
    compileOnly('com.tterrag.registrate:Registrate:MC1.21-1.3.0+67')
}
